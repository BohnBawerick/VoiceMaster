name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Scan the tree
        run: |
          # A private checkout may carry _archive/, void history that is never published.
          rm -rf _archive
          ./gitleaks dir . --redact --no-banner
      - name: Scan the commits this event adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ]; then
            range="$BEFORE..$AFTER"
          else
            echo "a new branch: the tree scan above covers it"; exit 0
          fi
          ./gitleaks git . --redact --no-banner --log-opts="$range"

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [voice, talk-voice-bridge, voice-control]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: |
          python -m venv .venv
          dev=; [ -f requirements-dev.txt ] && dev="-r requirements-dev.txt"
          .venv/bin/pip install -r requirements.txt $dev -e ../voicecore
      - name: The bridge venvs the dashboard's effective-config preview runs
        if: matrix.service == 'voice-control'
        working-directory: services
        run: |
          for s in voice talk-voice-bridge; do
            python -m venv "$s/.venv"
            dev=; [ -f "$s/requirements-dev.txt" ] && dev="-r $s/requirements-dev.txt"
            "$s/.venv/bin/pip" install -r "$s/requirements.txt" $dev -e voicecore
          done
      - name: Browsers for the dashboard's browser tests
        if: matrix.service == 'voice-control'
        working-directory: services/voice-control
        run: .venv/bin/playwright install --with-deps chromium
      - name: ffmpeg for the recording tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: .venv/bin/python -m pytest tests/ -q

  hermes-addons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: hermes
        run: |
          python -m pip install -r tests/requirements.txt
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests -q
          bash tests/test_supervisor.sh

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/voice-control/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/voice-control/ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: The committed bundle matches the source
        run: |
          git status --porcelain -- ../static
          test -z "$(git status --porcelain -- ../static)" || {
            echo "services/voice-control/static/ is out of date: run npm run build and commit it" >&2
            exit 1
          }
